name: Deploy live preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published preview
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          EXPECTED_PUBLIC_URL="${PUBLIC_SITE_URL:-https://washingtonmsdj.github.io/catalogo/}"
          case "$EXPECTED_PUBLIC_URL" in */) ;; *) EXPECTED_PUBLIC_URL="$EXPECTED_PUBLIC_URL/" ;; esac
          HTML="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$PAGE_URL")"
          printf '%s' "$HTML" | grep -q 'Tonecos Studios'
          printf '%s' "$HTML" | grep -Fq "rel=\"canonical\" href=\"$EXPECTED_PUBLIC_URL\""
          MANIFEST_URL="${PAGE_URL%/}/site.webmanifest"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$MANIFEST_URL" \
            | node -e "let body=''; process.stdin.on('data', c => body += c).on('end', () => { const data = JSON.parse(body); if (data.name !== 'Catálogo Tonecos Studios') process.exit(1); console.log('Preview ready:', data.name); });"
