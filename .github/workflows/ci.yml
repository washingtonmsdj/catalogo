name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install frontend and tooling
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test bounded browser metadata cache
        run: npm run test:known-cache
      - name: Check dialog architecture
        run: npm run dialog:a11y
      - name: Build frontend
        run: npm run build
      - name: Check frontend performance budget
        run: npm run budget:frontend
      - name: Typecheck Cloudflare Worker
        run: npm run typecheck:worker
      - name: Render deployment config
        env:
          CLOUDFLARE_D1_DATABASE_ID: 00000000-0000-0000-0000-000000000000
        run: npm run cloudflare:config
      - name: Dry-run Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --config .wrangler.deploy.jsonc --outdir .wrangler-dry-run
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install ingestion dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Test catalog pipelines and schema
        working-directory: tools
        run: python -m unittest -v test_ingest_catalog.py test_build_media_bundle.py test_plan_gallery_merge.py test_resolve_gallery_merge.py test_publish_r2.py test_reconcile_r2_state.py test_publish_d1.py test_publish_readiness.py test_verify_public_catalog.py test_catalog_folders_schema.py test_search_schema.py test_quote_schema.py test_quote_dedup.py test_shared_collections_schema.py test_pages_workflow_config.py test_cloudflare_workflow_config.py test_brand_identity.py
