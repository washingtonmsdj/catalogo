name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ingestion dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Test ingestion pipeline
        working-directory: tools
        run: python -m unittest -v test_ingest_catalog.py
