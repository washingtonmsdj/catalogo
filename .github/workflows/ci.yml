name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend and tooling
        run: npm install
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        run: npm run build
      - name: Check frontend performance budget
        run: npm run budget:frontend
      - name: Typecheck Cloudflare Worker
        run: npm run typecheck:worker
      - name: Render deployment config
        env:
          CLOUDFLARE_D1_DATABASE_ID: 00000000-0000-0000-0000-000000000000
        run: npm run cloudflare:config
      - name: Dry-run Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --config .wrangler.deploy.jsonc --outdir .wrangler-dry-run
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ingestion dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Test catalog pipelines and schema
        working-directory: tools
        run: python -m unittest -v test_ingest_catalog.py test_build_media_bundle.py test_publish_r2.py test_search_schema.py
