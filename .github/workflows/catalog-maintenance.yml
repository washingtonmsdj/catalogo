name: Maintain Catalog Data

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operação de verificação segura (sem auditoria integral do acervo)
        required: true
        default: verify-public-hierarchy
        type: choice
        options:
          - verify-public-hierarchy
          - verify-d1-schema

permissions:
  contents: read

concurrency:
  group: cloudflare-api
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CATALOG_API_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install
        run: npm ci
      - name: Validate safe maintenance operation and credentials
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          test -n "$CATALOG_API_URL" || { echo '::error::VITE_API_BASE_URL ausente'; exit 1; }
          case "$OPERATION" in
            verify-public-hierarchy) ;;
            verify-d1-schema)
              test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID ausente'; exit 1; }
              test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN ausente'; exit 1; }
              ;;
            *)
              echo '::error::Operação de manutenção fora da lista segura; não executar D1.'
              exit 1
              ;;
          esac
      - name: Export canonical D1 binding for schema verification
        if: ${{ inputs.operation == 'verify-d1-schema' }}
        shell: bash
        run: |
          set -euo pipefail
          database_id="$(node tools/read_wrangler_d1_id.mjs)"
          echo "CLOUDFLARE_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"
      # Analytics API only, no D1 SQL. Reserve before any Worker/D1 health
      # probes when checking the schema, even if the account was idle before.
      - name: Reserve D1 quota before schema verification
        if: ${{ inputs.operation == 'verify-d1-schema' }}
        run: python tools/check_d1_editorial_audit_budget.py
      - name: Validate active Worker health and schema
        run: node tools/check_worker_health.mjs "$CATALOG_API_URL"
      - name: Verify public hierarchy (read-only)
        if: ${{ inputs.operation == 'verify-public-hierarchy' }}
        run: node tools/check_public_catalog_hierarchy.mjs "$CATALOG_API_URL"
      - name: Verify canonical D1 schema only
        if: ${{ inputs.operation == 'verify-d1-schema' }}
        run: python tools/audit_d1_integrity.py --schema-only
