name: Deploy Cloudflare API

on:
  workflow_dispatch:
    inputs:
      apply_legacy_gallery_repairs:
        description: Aplicar os reparos de galerias legadas registrados e revisados após o deploy saudável
        required: false
        default: false
        type: boolean
      backfill_image_source_index:
        description: Preencher o índice SHA ausente lendo somente manifests JSON do R2
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tools/render_wrangler_config.mjs'
      - 'tools/wrangler_config_contract.mjs'
      - 'tools/read_wrangler_d1_id.mjs'
      - 'tools/cloudflare_deploy_state.mjs'
      - 'tools/check_staged_worker_version.mjs'
      - 'tools/check_migration_deploy_policy.py'
      - 'tools/check_worker_health.mjs'
      - 'tools/check_worker_gallery_contract.mjs'
      - 'tools/check_legacy_gallery_repairs.mjs'
      - 'tools/apply_legacy_gallery_repairs.py'
      - 'tools/backfill_image_source_index.py'
      - 'tools/audit_d1_integrity.py'
      - 'config/catalog-schema-contract.json'
      - 'config/migration-deploy-policy.json'
      - 'config/catalog-legacy-gallery-overrides.json'
      - '.github/workflows/cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-api
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Check production bootstrap readiness
        id: readiness
        shell: bash
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_URL: ${{ vars.VITE_API_BASE_URL }}
          MEDIA_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BACKFILL_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_image_source_index || false }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$TURNSTILE_SECRET" ] || missing+=(TURNSTILE_SECRET_KEY)
          [ -n "$API_URL" ] || missing+=(VITE_API_BASE_URL)
          if [ "$BACKFILL_SHA" = 'true' ] && [ -z "$MEDIA_URL" ]; then
            missing+=(VITE_MEDIA_BASE_URL)
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::error::Deploy Cloudflare bloqueado: faltam credenciais/configurações: ${missing[*]}"
            {
              echo '## Cloudflare API — deploy bloqueado'
              echo
              echo 'A publicação de produção não pode ser considerada concluída enquanto faltar:'
              for item in "${missing[@]}"; do echo "- \`$item\`"; done
              echo
              echo 'Consulte `docs/CLOUDFLARE_DEPLOY.md`. Em push para `main`, credencial ausente é falha de deploy e o workflow termina com erro.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo 'ready=true' >> "$GITHUB_OUTPUT"
          {
            echo '## Cloudflare API — bootstrap disponível'
            echo
            echo '- Account ID: configurado'
            echo '- D1 database ID: versionado no wrangler.jsonc e validado no job de deploy'
            echo '- API pública: configurada e obrigatória para smoke staged/pós-promoção'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CATALOG_API_URL: ${{ vars.VITE_API_BASE_URL }}
      CATALOG_MEDIA_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      WORKER_VERSION_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install
        run: npm ci
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN não está configurado.'; exit 1; }
          test -n "$TURNSTILE_SECRET_KEY" || { echo '::error::TURNSTILE_SECRET_KEY não está configurado.'; exit 1; }
          test -n "$CATALOG_API_URL" || { echo '::error::VITE_API_BASE_URL não está configurado.'; exit 1; }
      - name: Validate Worker
        run: npm run typecheck:worker
      - name: Export canonical D1 binding
        shell: bash
        run: |
          set -euo pipefail
          database_id="$(node tools/read_wrangler_d1_id.mjs)"
          echo "CLOUDFLARE_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"
      - name: Render production config
        run: npm run cloudflare:config
      - name: Capture current production Worker version
        shell: bash
        run: |
          set -euo pipefail
          previous_version="$(node tools/cloudflare_deploy_state.mjs active-version)"
          echo "PREVIOUS_WORKER_VERSION_ID=$previous_version" >> "$GITHUB_ENV"
      - name: Verify R2 bucket
        run: npx wrangler r2 bucket info tonecos-catalogo-media --json
      - name: Upload Worker version with required secret and no traffic
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-version-upload.ndjson
        run: |
          set -euo pipefail
          secrets_file="${RUNNER_TEMP}/tonecos-worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e "const fs=require('fs'); fs.writeFileSync(process.argv[1], JSON.stringify({TURNSTILE_SECRET_KEY: process.env.TURNSTILE_SECRET_KEY}), {mode:0o600})" "$secrets_file"
          npx wrangler versions upload \
            --tag "$WORKER_VERSION_TAG" \
            --message "catalogo ${GITHUB_SHA}" \
            --strict \
            --secrets-file "$secrets_file" \
            --config .wrangler.deploy.jsonc
      - name: Capture staged Worker version
        shell: bash
        run: |
          set -euo pipefail
          staged_version="$(node tools/cloudflare_deploy_state.mjs uploaded-version "${RUNNER_TEMP}/wrangler-version-upload.ndjson")"
          echo "STAGED_WORKER_VERSION_ID=$staged_version" >> "$GITHUB_ENV"
      - name: Validate migration-first compatibility
        run: python tools/check_migration_deploy_policy.py
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.deploy.jsonc
      - name: Smoke staged Worker version before promotion
        run: node tools/check_staged_worker_version.mjs "$CATALOG_API_URL" "$STAGED_WORKER_VERSION_ID"
      - name: Promote staged Worker version
        id: promote
        run: >-
          npx wrangler versions deploy
          --version-tag "${WORKER_VERSION_TAG}@100%"
          --message "catalogo ${GITHUB_SHA}"
          --yes
          --config .wrangler.deploy.jsonc
      - name: Verify Worker schema health
        run: node tools/check_worker_health.mjs "$CATALOG_API_URL"
      - name: Verify D1 readiness through catalog API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors "$CATALOG_API_URL/api/categories" \
            | node -e "let body=''; process.stdin.on('data', c => body += c).on('end', () => { const data = JSON.parse(body); if (!Array.isArray(data.items)) { console.error('categories response is invalid'); process.exit(1); } console.log('D1 ready:', data.items.length, 'category records'); });"
      - name: Verify recent catalog route
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors "$CATALOG_API_URL/api/recent?limit=3" \
            | node -e "let body=''; process.stdin.on('data', c => body += c).on('end', () => { const data = JSON.parse(body); if (!Array.isArray(data.items) || data.items.length < 1 || !data.items[0]?.slug) { console.error('recent catalog response is invalid'); process.exit(1); } console.log('Recent catalog ready:', data.items.length, 'models'); });"
      - name: Verify gallery contract through catalog API
        run: node tools/check_worker_gallery_contract.mjs "$CATALOG_API_URL"
      - name: Verify shared collections route
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          status="$(curl --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors \
            --output "$body_file" --write-out '%{http_code}' \
            "$CATALOG_API_URL/api/shared-collections/TCL-AAAAAAAAAAAAAAAA")"
          test "$status" = '404'
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if (data.error !== 'shared_collection_not_found') { console.error(data); process.exit(1); }" "$body_file"
      - name: Roll back Worker after failed production smoke
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        run: >-
          npx wrangler rollback "$PREVIOUS_WORKER_VERSION_ID"
          --message "automatic rollback after failed production smoke ${GITHUB_SHA}"
          --config .wrangler.deploy.jsonc
      - name: Audit D1 structural integrity
        run: python tools/audit_d1_integrity.py
      - name: Plan reviewed legacy gallery repairs
        run: python tools/apply_legacy_gallery_repairs.py
      - name: Measure image SHA index coverage
        run: python tools/backfill_image_source_index.py
      - name: Backfill image SHA index
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_image_source_index }}
        run: python tools/backfill_image_source_index.py --apply
      - name: Apply reviewed legacy gallery repairs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_legacy_gallery_repairs }}
        run: python tools/apply_legacy_gallery_repairs.py --apply
      - name: Verify repaired legacy aliases through public API
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_legacy_gallery_repairs }}
        run: node tools/check_legacy_gallery_repairs.mjs "$CATALOG_API_URL"
      - name: Re-audit D1 after legacy repairs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_legacy_gallery_repairs }}
        run: python tools/audit_d1_integrity.py
