name: Deploy Cloudflare API

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Retire the legacy source writers after the approved M5 GO
        required: false
        type: choice
        options:
          - none
          - m5-retire
        default: none
      m5_ack:
        description: Exact owner-approved M5 release scope
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'tools/render_wrangler_config.mjs'
      - 'tools/wrangler_config_contract.mjs'
      - 'tools/read_wrangler_d1_id.mjs'
      - 'tools/cloudflare_deploy_state.mjs'
      - 'tools/bounded_retry.mjs'
      - 'tools/worker_release_smoke.mjs'
      - 'tools/check_remote_worker_config.mjs'
      - 'tools/check_main_push_provenance.mjs'
      - 'tools/check_staged_worker_version.mjs'
      - 'tools/check_promoted_worker_version.mjs'
      - 'tools/check_worker_cache_hit.mjs'
      - 'tools/verify_public_catalog.py'
      - 'tools/check_migration_deploy_policy.py'
      - 'tools/catalog_schema_contract.py'
      - 'tools/check_worker_health.mjs'
      - 'config/catalog-schema-contract.json'
      - 'config/migration-deploy-policy.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cloudflare-api
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ false }} # Source publisher suspended: tonecosstudio/tonecosstudio is SSOT
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Verify main push provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node tools/check_main_push_provenance.mjs
      - name: Check production bootstrap readiness
        id: readiness
        shell: bash
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_URL: ${{ vars.VITE_API_BASE_URL }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$TURNSTILE_SECRET" ] || missing+=(TURNSTILE_SECRET_KEY)
          [ -n "$API_URL" ] || missing+=(VITE_API_BASE_URL)

          if [ "${#missing[@]}" -gt 0 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::error::Deploy Cloudflare bloqueado: faltam credenciais/configurações: ${missing[*]}"
            {
              echo '## Cloudflare API — deploy bloqueado'
              echo
              echo 'A publicação de produção não pode ser considerada concluída enquanto faltar:'
              for item in "${missing[@]}"; do echo "- \`$item\`"; done
              echo
              echo 'Consulte `docs/CLOUDFLARE_DEPLOY.md`. Em push para `main`, credencial ausente é falha de deploy e o workflow termina com erro.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo 'ready=true' >> "$GITHUB_OUTPUT"
          {
            echo '## Cloudflare API — bootstrap disponível'
            echo
            echo '- Account ID: configurado'
            echo '- D1 database ID: versionado no wrangler.jsonc e validado no job de deploy'
            echo '- API/mídia pública: uma única origem configurada e obrigatória para smoke staged/pós-promoção'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: ${{ false }} # Source publisher suspended at cutover; M5 is not authorized
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CATALOG_API_URL: ${{ vars.VITE_API_BASE_URL }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      WORKER_VERSION_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect D1 schema change scope
        id: d1_scope
        shell: bash
        run: |
          set -euo pipefail
          run_d1_schema=false

          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            run_d1_schema=true
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = '0000000000000000000000000000000000000000' ]; then
              run_d1_schema=true
            elif ! git diff --quiet "$before" "$GITHUB_SHA" -- migrations config/catalog-schema-contract.json; then
              run_d1_schema=true
            fi
          fi

          echo "run_d1_schema=$run_d1_schema" >> "$GITHUB_OUTPUT"
          echo "D1 schema work enabled: $run_d1_schema"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install
        run: npm ci
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN não está configurado.'; exit 1; }
          test -n "$TURNSTILE_SECRET_KEY" || { echo '::error::TURNSTILE_SECRET_KEY não está configurado.'; exit 1; }
          test -n "$CATALOG_API_URL" || { echo '::error::VITE_API_BASE_URL não está configurado.'; exit 1; }
      - name: Validate Worker
        run: npm run typecheck:worker
      - name: Export canonical D1 binding
        shell: bash
        run: |
          set -euo pipefail
          database_id="$(node tools/read_wrangler_d1_id.mjs)"
          echo "CLOUDFLARE_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"
      - name: Render production config
        run: npm run cloudflare:config
      - name: Validate remote Worker config before planned CORS expansion
        run: node tools/check_remote_worker_config.mjs --allow-cors-expansion
      - name: Capture current production Worker version
        shell: bash
        run: |
          set -euo pipefail
          previous_version="$(node tools/cloudflare_deploy_state.mjs active-version)"
          echo "PREVIOUS_WORKER_VERSION_ID=$previous_version" >> "$GITHUB_ENV"
      - name: Verify R2 bucket
        run: npx wrangler r2 bucket info tonecos-catalogo-media --json
      - name: Verify currently serving Worker health before runtime-only deploy
        if: ${{ steps.d1_scope.outputs.run_d1_schema != 'true' }}
        run: node tools/check_worker_health.mjs "$CATALOG_API_URL"
      # Guard by account analytics BEFORE touching D1. Runtime-only uses live health.
      - name: Protect D1 quota before schema-changing release
        if: ${{ steps.d1_scope.outputs.run_d1_schema == 'true' }}
        run: python tools/check_d1_editorial_audit_budget.py
      - name: Verify canonical D1 schema queries before uploading any Worker version
        if: ${{ steps.d1_scope.outputs.run_d1_schema == 'true' }}
        run: python tools/audit_d1_integrity.py --preflight-schema-readability
      - name: Upload Worker version with required secret and no traffic
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-version-upload.ndjson
        run: |
          set -euo pipefail
          secrets_file="${RUNNER_TEMP}/tonecos-worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e "const fs=require('fs'); fs.writeFileSync(process.argv[1], JSON.stringify({TURNSTILE_SECRET_KEY: process.env.TURNSTILE_SECRET_KEY}), {mode:0o600})" "$secrets_file"
          npx wrangler versions upload \
            --tag "$WORKER_VERSION_TAG" \
            --message "catalogo ${GITHUB_SHA}" \
            --secrets-file "$secrets_file" \
            --config .wrangler.deploy.jsonc
      - name: Capture staged Worker version
        shell: bash
        run: |
          set -euo pipefail
          staged_version="$(node tools/cloudflare_deploy_state.mjs uploaded-version "${RUNNER_TEMP}/wrangler-version-upload.ndjson")"
          echo "STAGED_WORKER_VERSION_ID=$staged_version" >> "$GITHUB_ENV"
      - name: Validate migration-first compatibility
        run: python tools/check_migration_deploy_policy.py
      - name: Apply D1 migrations
        if: ${{ steps.d1_scope.outputs.run_d1_schema == 'true' }}
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.deploy.jsonc
      # Never run the unbounded full data audit as part of a deployment.
      - name: Recheck D1 quota before bounded schema validation
        if: ${{ steps.d1_scope.outputs.run_d1_schema == 'true' }}
        run: python tools/check_d1_editorial_audit_budget.py
      - name: Verify D1 schema contract after migrations
        if: ${{ steps.d1_scope.outputs.run_d1_schema == 'true' }}
        run: python tools/audit_d1_integrity.py --schema-only
      - name: Register staged Worker at zero traffic
        id: stage_deployment
        run: >-
          npx wrangler versions deploy
          "${PREVIOUS_WORKER_VERSION_ID}@100%"
          "${STAGED_WORKER_VERSION_ID}@0%"
          --message "staged smoke ${GITHUB_SHA}"
          --yes
          --config .wrangler.deploy.jsonc
      - name: Smoke staged Worker version before promotion
        run: node tools/check_staged_worker_version.mjs "$CATALOG_API_URL" "$STAGED_WORKER_VERSION_ID"
      - name: Promote staged Worker version
        id: promote
        run: >-
          npx wrangler versions deploy
          "${STAGED_WORKER_VERSION_ID}@100%"
          --message "catalogo ${GITHUB_SHA}"
          --yes
          --config .wrangler.deploy.jsonc
      - name: Verify exact canonical Worker config after promotion
        run: node tools/check_remote_worker_config.mjs
      - name: Verify promoted Worker deployment and full public release
        run: node tools/check_promoted_worker_version.mjs "$CATALOG_API_URL" "$STAGED_WORKER_VERSION_ID"
      - name: Verify public media gateway after promotion
        run: python tools/verify_public_catalog.py --api-base "$CATALOG_API_URL"
      - name: Verify live public catalog hierarchy after promotion
        run: node tools/check_public_catalog_hierarchy.mjs "$CATALOG_API_URL"
      - name: Verify Workers Cache hit after promotion
        run: node tools/check_worker_cache_hit.mjs "$CATALOG_API_URL"
      - name: Restore previous Worker after failed staged or production smoke
        if: ${{ failure() && steps.stage_deployment.outcome == 'success' }}
        run: >-
          npx wrangler rollback "$PREVIOUS_WORKER_VERSION_ID"
          --message "automatic restore after failed deploy validation ${GITHUB_SHA}"
          --config .wrangler.deploy.jsonc

  # One-time administrative retirement; not a deploy or another D1/R2 writer.
  m5-retire-source-writers:
    name: M5 retire five legacy production writers
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'm5-retire' && inputs.m5_ack == 'GO-M5-0028-0033-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify target publisher exists and source is quiescent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "washingtonmsdj/catalogo"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)" = 371358484
          gh api repos/tonecosstudio/tonecosstudio/contents/scripts/catalog/m5-d1-bounded-release.mjs --jq .sha >/dev/null
          target="$(gh api repos/tonecosstudio/tonecosstudio/contents/.github/workflows/quality.yml --jq .content | base64 -d)"
          grep -Fq 'catalog-m5-d1-schema:' <<<"$target"
          grep -Fq 'catalog-controlled-worker-release:' <<<"$target"
          for id in 371358484 384544141 385740730 385342502 385318875; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$id" --jq .state)"
            [[ "$state" == active || "$state" == disabled_manually ]] || exit 2
          done
          for status in running queued requested waiting pending; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100")"
            jq -e '.workflow_runs | length < 100' <<<"$runs" >/dev/null
            jq -e --argjson self "$GITHUB_RUN_ID" \
              '[.workflow_runs[] | select((.workflow_id == 371358484 or .workflow_id == 384544141 or .workflow_id == 385740730 or .workflow_id == 385342502 or .workflow_id == 385318875) and .id != $self)] | length == 0' \
              <<<"$runs" >/dev/null
          done
      - name: Disable four dependent D1 and R2 writers first
        shell: bash
        run: |
          set -euo pipefail
          for id in 384544141 385740730 385342502 385318875; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$id" --jq .state)"
            if [[ "$state" == active ]]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"
            fi
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$id" --jq .state)" = disabled_manually
          done
      - name: Disable the original Worker workflow last
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/371358484" --jq .state)"
          if [[ "$state" == active ]]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/371358484/disable"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/371358484" --jq .state)" = disabled_manually
          echo 'M5_SOURCE_FIVE_WRITERS_DISABLED'
