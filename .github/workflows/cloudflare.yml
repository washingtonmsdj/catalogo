name: Deploy Cloudflare API

on:
  workflow_dispatch:
    inputs:
      force_turnstile_secret_sync:
        description: Reenviar o segredo do Turnstile para o Worker (use em rotação de chave)
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tools/render_wrangler_config.mjs'
      - '.github/workflows/cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-api
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CATALOG_CORS_ORIGINS: ${{ vars.CATALOG_CORS_ORIGINS }}
      CATALOG_API_URL: ${{ vars.VITE_API_BASE_URL }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN não está configurado.'
            exit 1
          fi
          if [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo '::error::TURNSTILE_SECRET_KEY não está configurado.'
            exit 1
          fi
      - name: Validate Worker
        run: npm run typecheck:worker
      - name: Render production config
        run: npm run cloudflare:config
      - name: Verify R2 bucket
        run: npx wrangler r2 bucket info tonecos-catalogo-media --json
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.deploy.jsonc
      - name: Deploy Worker
        run: npx wrangler deploy --config .wrangler.deploy.jsonc
      - name: Ensure Turnstile Worker secret
        shell: bash
        env:
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force_turnstile_secret_sync || false }}
        run: |
          set -euo pipefail
          SECRET_LIST="$(npx wrangler secret list --config .wrangler.deploy.jsonc --format json)"
          if [ "$FORCE_SYNC" = 'true' ] || ! printf '%s' "$SECRET_LIST" | grep -q '"TURNSTILE_SECRET_KEY"'; then
            printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY --config .wrangler.deploy.jsonc
          else
            echo 'TURNSTILE_SECRET_KEY já configurado no Worker.'
          fi
          npx wrangler secret list --config .wrangler.deploy.jsonc --format json | grep -q '"TURNSTILE_SECRET_KEY"'
      - name: Verify Worker liveness
        if: ${{ vars.VITE_API_BASE_URL != '' }}
        run: curl --fail --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors "$CATALOG_API_URL/api/health"
      - name: Verify D1 readiness through catalog API
        if: ${{ vars.VITE_API_BASE_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors "$CATALOG_API_URL/api/categories" \
            | node -e "let body=''; process.stdin.on('data', c => body += c).on('end', () => { const data = JSON.parse(body); if (!Array.isArray(data.items)) { console.error('categories response is invalid'); process.exit(1); } console.log('D1 ready:', data.items.length, 'category records'); });"
