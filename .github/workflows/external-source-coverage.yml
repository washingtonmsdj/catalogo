name: External source catalog coverage

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/external-source-coverage.yml'
      - 'tools/audit_external_source_coverage.py'
      - 'tools/test_audit_external_source_coverage.py'
      - 'tools/plan_external_identity_triage.py'
      - 'tools/test_plan_external_identity_triage.py'
      - 'tools/select_external_priority_batch.py'
      - 'tools/test_select_external_priority_batch.py'
      - 'tools/discover_external_staging_candidates.py'
      - 'tools/enrich_external_candidate_identity.py'
      - 'tools/test_enrich_external_candidate_identity.py'
      - 'docs/evidence/external-source-001-*-visual-identity-resolution-*.json'
      - 'config/external-sources/external-source-001.json'

permissions:
  contents: read

concurrency:
  group: external-source-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Read-only metadata coverage audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Test conservative coverage semantics
        working-directory: tools
        run: python -m unittest -v test_audit_external_source_coverage.py test_plan_external_identity_triage.py
      - name: Verify read-only bindings
        shell: bash
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID ausente'; exit 1; }
          test -n "$API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN ausente'; exit 1; }
          database_id="$(node tools/read_wrangler_d1_id.mjs)"
          test -n "$database_id" || { echo '::error::D1 database id ausente'; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"
      - name: Audit source coverage without media downloads or writes
        run: >-
          python tools/audit_external_source_coverage.py
          --output "$RUNNER_TEMP/external-source-coverage.json"
      - name: Generate entire backlog triage from canonical coverage (read-only)
        run: >-
          python tools/plan_external_identity_triage.py
          "$RUNNER_TEMP/external-source-coverage.json"
          --output "$RUNNER_TEMP/external-source-identity-triage.json"
      - name: Assert report remained conservative and read-only
        shell: bash
        run: |
          python - "$RUNNER_TEMP/external-source-coverage.json" <<'PY'
          import json, sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          summary=report['summary']
          assert summary['sourceProducts'] > 0
          assert summary['publishedModels'] > 0
          assert summary['productionWrites'] == 0
          assert summary['stagingWrites'] == 0
          assert summary['confirmedPresent'] <= summary['sourceProducts']
          assert isinstance(summary['coverage100Proven'], bool)
          assert len(report['products']) == summary['sourceProducts']
          triage=json.loads(Path(__import__('os').environ['RUNNER_TEMP'], 'external-source-identity-triage.json').read_text(encoding='utf-8'))
          t=triage['summary']
          assert t['sourceProducts']==summary['sourceProducts']
          assert t['confirmedPublishedIdentities']==summary['confirmedPresent']
          assert t['workItems']+t['confirmedPublishedIdentities']==t['sourceProducts']
          assert t['productionWrites']==t['stagingWrites']==0
          assert all(x['identityApproved'] is False and x['mediaPromotionAuthorized'] is False for x in triage['workItems'])
          print(json.dumps({'coverage': summary, 'triage': t}, ensure_ascii=False))
          PY
      - name: Test bounded priority cohort and image-review guards
        working-directory: tools
        run: >-
          python -m unittest -v
          test_select_external_priority_batch.py
          test_discover_external_staging_candidates.py
          test_discover_external_staging_candidates_http.py
          test_enrich_external_candidate_identity.py
      - name: Select next image-review cohort from the same canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          python tools/select_external_priority_batch.py \
            "$RUNNER_TEMP/external-source-coverage.json" \
            "$RUNNER_TEMP/external-source-identity-triage.json" \
            --limit 3 \
            --output "$RUNNER_TEMP/external-source-priority-review-batch.json"
          ids="$(python - "$RUNNER_TEMP/external-source-priority-review-batch.json" <<'PY'
          import json, sys
          from pathlib import Path
          batch = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(','.join(str(pid) for pid in batch['selectedProductIds']))
          PY
          )"
          echo "PRIORITY_COHORT_IDS=$ids" >> "$GITHUB_ENV"
          if [[ -n "$ids" ]]; then
            echo "PRIORITY_COHORT_READY=true" >> "$GITHUB_ENV"
            echo "Priority read-only review IDs: $ids"
          else
            echo "PRIORITY_COHORT_READY=false" >> "$GITHUB_ENV"
            echo "No same-franchise single-candidate cohort available"
          fi
      - name: Inspect priority source and production covers without writes
        if: env.PRIORITY_COHORT_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/discover_external_staging_candidates.py \
            --page 44 \
            --per-page 20 \
            --max-products 3 \
            --product-ids "$PRIORITY_COHORT_IDS" \
            --max-review-products 3 \
            --output "$RUNNER_TEMP/external-priority-image-review"
          python tools/enrich_external_candidate_identity.py \
            "$RUNNER_TEMP/external-priority-image-review/discovery-report.json" \
            --review-root "$RUNNER_TEMP/external-priority-image-review/review" \
            --priority-batch "$RUNNER_TEMP/external-source-priority-review-batch.json"
      - name: Assert priority image review is unchanged and read-only
        if: env.PRIORITY_COHORT_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/external-source-priority-review-batch.json" "$RUNNER_TEMP/external-priority-image-review/discovery-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          batch=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          discovery=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          ids=batch['selectedProductIds']
          assert 1 <= len(ids) <= 3
          assert discovery['productionWrites'] == discovery['stagingWrites'] == 0
          assert discovery['requestedProductIds'] == ids
          assert [p['productId'] for p in discovery['products']] == ids
          assert discovery['productsScanned'] == len(ids)
          assert all(p['identityApproved'] is False and p['mediaPromotionAuthorized'] is False for p in batch['selected'])
          assert all(p.get('promotable') is not True and p.get('identityDecision') not in {'map_existing','new_model'} for p in discovery['products'])
          print(json.dumps({'priorityIds': ids, 'sourceBytesHashed': discovery['sourceBytesHashed'],
                            'productionCoverReviewObjects': discovery.get('productionCoverReviewObjects', 0),
                            'productionWrites': 0, 'stagingWrites': 0}, ensure_ascii=False))
          PY
      - name: Upload short-lived priority visual review evidence
        if: env.PRIORITY_COHORT_READY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: external-priority-visual-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/external-source-priority-review-batch.json
            ${{ runner.temp }}/external-priority-image-review
          if-no-files-found: error
          retention-days: 1
      - name: Upload short-lived coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: external-source-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/external-source-coverage.json
            ${{ runner.temp }}/external-source-identity-triage.json
            ${{ runner.temp }}/external-source-priority-review-batch.json
          if-no-files-found: error
          retention-days: 3
